[project]
name = "agent-bazaar-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "anthropic>=0.70,<1",
  "x402[fastapi,httpx,evm]>=2,<3", "web3>=7,<8", "pydantic>=2,<3",
  "pydantic-settings>=2,<3", "tenacity>=9,<10", "psycopg[binary,pool]>=3,<4",
  "upstash-redis>=1,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2"
]
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
